
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070c">
<title>NOIR | تسجيل الدخول</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #08070c;
  --panel: #100e17;
  --panel-light: #171321;
  --purple: #a78bfa;
  --purple-dark: #7851bd;
  --silver: #e4e0ed;
  --muted: #918a9f;
  --border: #282231;
  --danger: #ff8f9a;
  --success: #b9e7ca;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: "Cairo", sans-serif;
  color: var(--silver);
  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(110, 73, 160, 0.14),
      transparent 48%
    ),
    var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 35px 18px;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.top {
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 26px;
}

.brand {
  direction: ltr;
  font-family: "Cormorant Garamond", serif;
  font-size: 35px;
  font-weight: 700;
  letter-spacing: 5px;
  color: #f0edf6;
}

.brand span {
  color: var(--purple);
}

.home-link {
  font-size: 12px;
  color: var(--muted);
  transition: color .2s;
}

.home-link:hover {
  color: var(--silver);
}

.card {
  width: 100%;
  max-width: 430px;
  background: linear-gradient(
    145deg,
    rgba(22, 18, 32, .98),
    rgba(12, 10, 17, .99)
  );
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 34px 30px;
  box-shadow:
    0 25px 90px rgba(0, 0, 0, .38),
    0 0 50px rgba(116, 76, 170, .045);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 22%;
  right: 22%;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--purple-dark),
    transparent
  );
}

.symbol {
  width: 42px;
  height: 42px;
  margin: 0 auto 18px;
  border: 1px solid #403050;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple);
  font-family: "Cormorant Garamond", serif;
  font-size: 25px;
  box-shadow: inset 0 0 20px #a78bfa08;
}

.heading {
  text-align: center;
  margin-bottom: 27px;
}

.heading h1 {
  font-size: 24px;
  font-weight: 700;
  color: #f1edf8;
  margin-bottom: 7px;
}

.heading p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.9;
}

.field {
  margin-bottom: 17px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 12px;
  color: #d3cddd;
}

.input-wrap {
  position: relative;
}

.input-wrap input {
  display: block;
  width: 100%;
  height: 48px;
  background: #0b0911;
  color: var(--silver);
  border: 1px solid #30283c;
  border-radius: 10px;
  outline: none;
  padding: 0 14px;
  font-size: 13px;
  transition: border-color .2s, box-shadow .2s;
}

.input-wrap input::placeholder {
  color: #625a70;
}

.input-wrap input:focus {
  border-color: #8a69c4;
  box-shadow: 0 0 0 3px #a78bfa12;
}

.input-wrap input[type="password"],
.input-wrap input.password-input {
  padding-left: 65px;
}

.show-password {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 11px;
}

.show-password:hover {
  color: var(--purple);
}

.form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 1px 0 22px;
  font-size: 11px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
}

.remember input {
  accent-color: var(--purple-dark);
}

.text-link {
  color: var(--purple);
  transition: color .2s;
}

.text-link:hover {
  color: #d1bfff;
}

.primary {
  width: 100%;
  min-height: 48px;
  border: 1px solid #b5a0ed;
  border-radius: 10px;
  background: linear-gradient(110deg, #b7a1ed, #9171cf);
  color: #100b19;
  font-size: 13px;
  font-weight: 800;
  transition: transform .2s, filter .2s;
}

.primary:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.primary:disabled {
  opacity: .6;
  cursor: wait;
  transform: none;
}

.separator {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 23px 0;
  color: #6e657c;
  font-size: 11px;
}

.separator::before,
.separator::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.secondary {
  width: 100%;
  min-height: 45px;
  border: 1px solid #332b40;
  border-radius: 10px;
  background: #100d17;
  color: #d6d0e0;
  font-size: 12px;
  transition: background .2s, border-color .2s;
}

.secondary:hover {
  background: #191423;
  border-color: #56436e;
}

.switch-text {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 25px;
}

.switch-text a {
  margin-right: 4px;
  font-weight: 700;
}

.message {
  display: none;
  margin-bottom: 17px;
  padding: 11px 12px;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.8;
}

.message.error {
  display: block;
  color: var(--danger);
  background: #ff8f9a0d;
  border: 1px solid #ff8f9a25;
}

.message.success {
  display: block;
  color: var(--success);
  background: #b9e7ca0b;
  border: 1px solid #b9e7ca22;
}

.footer {
  margin-top: 24px;
  text-align: center;
  font-size: 10px;
  line-height: 2;
  color: #625a70;
}

.footer span {
  color: #9385ac;
  letter-spacing: 2px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 480px) {
  body {
    padding: 24px 15px;
  }

  .top {
    margin-bottom: 21px;
  }

  .brand {
    font-size: 31px;
  }

  .card {
    padding: 30px 22px 25px;
    border-radius: 16px;
  }

  .heading h1 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header class="top">
  <a class="brand" href="index.html" aria-label="NOIR Home">
    N<span>OIR.</span>
  </a>

  <a class="home-link" href="index.html">العودة للرئيسية ←</a>
</header>

<main class="card">

  <div class="symbol" aria-hidden="true">N</div>

  <div class="heading">
    <h1 id="formTitle">مرحبًا بعودتك</h1>
    <p id="formSubtitle">سجّل دخولك وتابع رحلتك في عالم NOIR.</p>
  </div>

  <div id="message" class="message" role="status" aria-live="polite"></div>

  <form id="authForm" novalidate>

    <div class="field" id="nameField" hidden>
      <label for="name">اسم المستخدم</label>
      <div class="input-wrap">
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="nickname"
          placeholder="اكتب اسمك"
        >
      </div>
    </div>

    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <div class="input-wrap">
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="name@example.com"
          required
        >
      </div>
    </div>

    <div class="field" id="passwordField">
      <label for="password">كلمة المرور</label>
      <div class="input-wrap">
        <input
          id="password"
          class="password-input"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="أدخل كلمة المرور"
          minlength="6"
          required
        >
        <button
          class="show-password"
          type="button"
          id="togglePassword"
          aria-label="إظهار كلمة المرور"
        >إظهار</button>
      </div>
    </div>

    <div class="form-options" id="formOptions">
      <label class="remember">
        <input type="checkbox" id="remember">
        تذكرني
      </label>

      <a href="#" class="text-link" id="forgotLink">نسيت كلمة المرور؟</a>
    </div>

    <button class="primary" type="submit" id="submitButton">
      تسجيل الدخول
    </button>

  </form>

  <div id="extraOptions">
    <div class="separator">أو</div>
    <button class="secondary" type="button" id="googleButton">
      Continue with Google
    </button>
  </div>

  <p class="switch-text" id="switchText">
    ليس لديك حساب؟
    <a href="#" class="text-link" id="switchLink">إنشاء حساب جديد</a>
  </p>

</main>

<footer class="footer">
  <span>NOIR</span>
  <p>عالم آخر، خلف كل صفحة.</p>
</footer>

<script>
const authForm = document.getElementById("authForm");
const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");
const nameField = document.getElementById("nameField");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const passwordField = document.getElementById("passwordField");
const formOptions = document.getElementById("formOptions");
const extraOptions = document.getElementById("extraOptions");
const submitButton = document.getElementById("submitButton");
const switchText = document.getElementById("switchText");
const switchLink = document.getElementById("switchLink");
const forgotLink = document.getElementById("forgotLink");
const togglePassword = document.getElementById("togglePassword");
const message = document.getElementById("message");
const googleButton = document.getElementById("googleButton");

let currentMode = "login";

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "message " + type;
}

function clearMessage() {
  message.textContent = "";
  message.className = "message";
}

function setMode(mode) {
  currentMode = mode;
  clearMessage();
  authForm.reset();

  passwordInput.type = "password";
  togglePassword.textContent = "إظهار";

  nameField.hidden = mode !== "register";
  passwordField.hidden = mode === "forgot";
  formOptions.hidden = mode !== "login";
  extraOptions.hidden = mode === "forgot";

  nameInput.required = mode === "register";
  passwordInput.required = mode !== "forgot";
  passwordInput.autocomplete =
    mode === "register" ? "new-password" : "current-password";

  if (mode === "login") {
    formTitle.textContent = "مرحبًا بعودتك";
    formSubtitle.textContent =
      "سجّل دخولك وتابع رحلتك في عالم NOIR.";
    submitButton.textContent = "تسجيل الدخول";
    switchText.innerHTML =
      'ليس لديك حساب؟ <a href="#" class="text-link" id="switchLink">إنشاء حساب جديد</a>';
  } else if (mode === "register") {
    formTitle.textContent = "أنشئ حسابك";
    formSubtitle.textContent =
      "خطوتك الأولى نحو عالم NOIR.";
    submitButton.textContent = "إنشاء الحساب";
    switchText.innerHTML =
      'لديك حساب بالفعل؟ <a href="#" class="text-link" id="switchLink">تسجيل الدخول</a>';
  } else {
    formTitle.textContent = "استعادة كلمة المرور";
    formSubtitle.textContent =
      "أدخل بريدك الإلكتروني لاستعادة حسابك.";
    submitButton.textContent = "إرسال رابط الاستعادة";
    switchText.innerHTML =
      '<a href="#" class="text-link" id="switchLink">العودة إلى تسجيل الدخول</a>';
  }

  bindSwitchLink();
}

function bindSwitchLink() {
  const link = document.getElementById("switchLink");

  link.addEventListener("click", function(event) {
    event.preventDefault();

    if (currentMode === "login") {
      setMode("register");
    } else {
      setMode("login");
    }
  });
}

switchLink.addEventListener("click", function(event) {
  event.preventDefault();
  setMode("register");
});

forgotLink.addEventListener("click", function(event) {
  event.preventDefault();
  setMode("forgot");
});

togglePassword.addEventListener("click", function() {
  const isHidden = passwordInput.type === "password";
  passwordInput.type = isHidden ? "text" : "password";
  togglePassword.textContent = isHidden ? "إخفاء" : "إظهار";
  togglePassword.setAttribute(
    "aria-label",
    isHidden ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"
  );
});

authForm.addEventListener("submit", function(event) {
  event.preventDefault();
  clearMessage();

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const name = nameInput.value.trim();

  if (!email || !emailInput.validity.valid) {
    showMessage("يرجى إدخال بريد إلكتروني صحيح.");
    emailInput.focus();
    return;
  }

  if (currentMode === "register" && !name) {
    showMessage("يرجى إدخال اسم المستخدم.");
    nameInput.focus();
    return;
  }

  if (currentMode !== "forgot" && password.length < 6) {
    showMessage("يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.");
    passwordInput.focus();
    return;
  }

  /*
    واجهة تجريبية فقط:
    اربط هذا الجزء بخدمة مصادقة حقيقية مثل Firebase Auth.
    لا تحفظ كلمات المرور في localStorage أو داخل المتصفح.
  */

  if (currentMode === "login") {
    showMessage(
      "واجهة تسجيل الدخول جاهزة، لكن يلزم ربط نظام Auth للتحقق من الحساب.",
      "error"
    );
  } else if (currentMode === "register") {
    showMessage(
      "واجهة إنشاء الحساب جاهزة، لكن يلزم ربط نظام Auth لإنشاء حساب فعلي.",
      "error"
    );
  } else {
    showMessage(
      "يلزم ربط نظام Auth لإرسال رابط استعادة كلمة المرور.",
      "error"
    );
  }
});

googleButton.addEventListener("click", function() {
  showMessage(
    "تسجيل Google يحتاج إعداد مزود Google داخل نظام المصادقة.",
    "error"
  );
});

setMode("login");
</script>

</body>
</html>
