
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080711">
<title>NOIR | تسجيل الدخول</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root {
  --bg: #080711;
  --panel: #111020;
  --purple: #a58aff;
  --silver: #d9d5e5;
  --muted: #9691aa;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 15% 10%, #30204e 0%, transparent 42%),
    radial-gradient(ellipse at 90% 90%, #24153b 0%, transparent 38%),
    var(--bg);
  color: #f6f3ff;
  font-family: 'IBM Plex Sans Arabic', sans-serif;
}

button, input {
  font: inherit;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

.page {
  width: 100%;
  max-width: 1040px;
  min-height: 570px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  border: 1px solid #39304f;
  border-radius: 22px;
  background: #0d0b18;
  box-shadow: 0 25px 90px #0008;
}

/* الجانب الفني */

.art-side {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 570px;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 42%, #493365 0%, #21172f 30%, #100d1c 68%, #090711 100%);
  border-left: 1px solid #39304f;
}

.art-side::before,
.art-side::after {
  content: "";
  position: absolute;
  border: 1px solid #a58aff24;
  border-radius: 50%;
  width: 340px;
  height: 340px;
}

.art-side::after {
  width: 440px;
  height: 440px;
}

.orbit {
  position: absolute;
  width: 270px;
  height: 390px;
  border: 1px solid #c7b3ff35;
  border-radius: 50%;
  transform: rotate(42deg);
}

.moon {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  position: relative;
  z-index: 1;
  background:
    radial-gradient(circle at 30% 25%, #e8ddff 0%, #a58aff 8%, #5d437f 32%, #20152f 65%, #080711 82%);
  box-shadow:
    0 0 35px #a58aff55,
    0 0 100px #8d63d444,
    inset -20px -15px 35px #0008;
}

.art-caption {
  position: absolute;
  bottom: 25px;
  left: 25px;
  right: 25px;
  text-align: center;
  z-index: 3;
}
}

.art-caption h2 {
  direction: ltr;
  font-size: 27px;
  letter-spacing: 7px;
  margin: 0 0 10px;
}

.art-caption h2 span {
  color: var(--purple);
}

.art-caption p {
  color: #aaa1bd;
  font-size: 12px;
  letter-spacing: 1px;
  margin: 0;
}

/* نموذج تسجيل الدخول */

.form-side {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 38px;
}

.form-content {
  width: 100%;
  max-width: 360px;
}

.logo {
  direction: ltr;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 3px;
  margin-bottom: 28px;
}

.logo span {
  color: var(--purple);
}

.heading {
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 8px;
}

.subtitle {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 28px;
  line-height: 1.9;
}

.field {
  margin-bottom: 19px;
}

.field label {
  display: block;
  margin-bottom: 9px;
  font-size: 13px;
  color: var(--silver);
}

.input-wrap {
  position: relative;
}

.field input {
  display: block;
  width: 100%;
  height: 48px;
  border: 1px solid #39304f;
  border-radius: 9px;
  outline: none;
  padding: 0 13px;
  background: #090813;
  color: white;
  transition: border-color .2s, box-shadow .2s;
}

.field input::placeholder {
  color: #69647a;
  font-size: 12px;
}

.field input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px #a58aff14;
}

.password-input {
  padding-left: 48px !important;
}

.show-password {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  border: 0;
  background: transparent;
  font-size: 17px;
  padding: 4px;
}

.forgot-row {
  display: flex;
  justify-content: flex-start;
  margin-top: -7px;
  margin-bottom: 23px;
}

.text-link {
  color: var(--purple);
  font-size: 12px;
  text-decoration: none;
}

.text-link:hover {
  color: #d4c5ff;
  text-decoration: underline;
}

.submit {
  width: 100%;
  min-height: 49px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  border: 1px solid #c0aaff;
  border-radius: 9px;
  color: #171025;
  background: linear-gradient(110deg, #d0c0ff, #a58aff 55%, #9270e8);
  box-shadow: 0 0 20px #a58aff32;
  font-weight: 700;
  font-size: 14px;
  transition: .2s;
  cursor: pointer;
}

.submit:hover {
  box-shadow: 0 0 30px #a58aff65;
  transform: translateY(-1px);
}

.submit .arrow {
  font-size: 19px;
}

.divider {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 23px 0;
  color: #89829c;
  font-size: 12px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #30283f;
}

.google-btn {
  width: 100%;
  min-height: 47px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  background: #090813;
  color: #f0ecfa;
  border: 1px solid #514366;
  border-radius: 9px;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
}

.google-btn:hover {
  border-color: var(--purple);
  box-shadow: 0 0 16px #a58aff1b;
}

.google-icon {
  direction: ltr;
  font-family: Arial, sans-serif;
  font-size: 21px;
  font-weight: bold;
  background: conic-gradient(
    from -45deg,
    #4285F4 0deg 90deg,
    #34A853 90deg 180deg,
    #FBBC05 180deg 250deg,
    #EA4335 250deg 310deg,
    #4285F4 310deg 360deg
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.bottom-text {
  margin: 25px 0 0;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.bottom-text a {
  display: inline-block;
  margin-right: 5px;
  color: var(--purple);
  text-decoration: none;
  font-weight: 600;
}

.bottom-text a:hover {
  text-decoration: underline;
}

.back {
  display: block;
  margin-top: 22px;
  text-align: center;
  color: #827a96;
  text-decoration: none;
  font-size: 12px;
}

.back:hover {
  color: var(--silver);
}

.notice {
  margin-top: 15px;
  font-size: 12px;
  line-height: 1.8;
  color: #d9d5e5;
  text-align: center;
}

.hidden {
  display: none !important;
}

@media (max-width: 760px) {
  body {
    padding: 16px;
    align-items: center;
  }

  .page {
    max-width: 440px;
    min-height: auto;
    grid-template-columns: 1fr;
    border-radius: 17px;
  }

  .art-side {
    min-height: 155px;
    border-left: 0;
    border-bottom: 1px solid #39304f;
  }

  .art-side::before {
    width: 180px;
    height: 180px;
  }

  .art-side::after {
    width: 230px;
    height: 230px;
  }

  .orbit {
    width: 110px;
    height: 180px;
  }

  .moon {
    width: 82px;
    height: 82px;
  }

  .art-caption {
    bottom: 13px;
  }

  .art-caption h2 {
    font-size: 17px;
    letter-spacing: 5px;
    margin-bottom: 3px;
  }

  .art-caption p {
    font-size: 9px;
  }

  .form-side {
    padding: 30px 23px;
  }

  .logo {
    font-size: 27px;
    margin-bottom: 20px;
  }

  .heading {
    font-size: 23px;
  }

  .subtitle {
    margin-bottom: 23px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="art-side" aria-label="NOIR">
    <div class="orbit"></div>
    <div class="moon"></div>

    <div class="art-caption">
      <h2>N<span>OIR.</span></h2>
      <p>BEYOND THE DARK</p>
    </div>
  </section>

  <section class="form-side">
    <div class="form-content">

      <div class="logo">N<span>OIR.</span></div>

      <h1 class="heading" id="heading">تسجيل الدخول</h1>
      <p class="subtitle" id="subtitle">
        أهلًا بعودتك. تابع رحلتك بين عوالم القصص.
      </p>

      <form id="accountForm">

        <div class="field hidden" id="nameGroup">
          <label for="username">اسم المستخدم</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="اكتب اسم المستخدم"
            autocomplete="username"
            minlength="3"
          >
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>

          <div class="input-wrap">
            <input
              class="password-input"
              id="password"
              name="password"
              type="password"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-password"
              id="togglePassword"
              aria-label="إظهار كلمة المرور"
              title="إظهار كلمة المرور"
            >◉</button>
          </div>
        </div>

        <div class="forgot-row" id="forgotRow">
          <a href="#" class="text-link" id="forgotLink">
            نسيت كلمة المرور؟
          </a>
        </div>

        <button class="submit" type="submit" id="submitBtn">
          <span id="submitText">تسجيل الدخول</span>
          <span class="arrow">←</span>
        </button>

      </form>

      <div class="divider" id="divider">أو</div>

      <button class="google-btn" type="button" id="googleBtn">
        <span class="google-icon" aria-hidden="true">G</span>
        <span id="googleText">المتابعة باستخدام Google</span>
      </button>

      <p class="bottom-text">
        <span id="bottomLabel">ليس لديك حساب؟</span>
        <a href="#" id="switchLink">إنشاء حساب جديد</a>
      </p>

      <div class="notice" id="notice" aria-live="polite"></div>

      <a href="index.html" class="back" id="backLink">
        ← العودة إلى الصفحة الرئيسية
      </a>

    </div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);

let mode = "login";

function setMode(newMode) {
  mode = newMode;

  const isLogin = mode === "login";
  const isRegister = mode === "register";
  const isForgot = mode === "forgot";

  $("notice").textContent = "";

  $("nameGroup").classList.toggle("hidden", !isRegister);
  $("forgotRow").classList.toggle("hidden", !isLogin);
  $("divider").classList.toggle("hidden", isForgot);
  $("googleBtn").classList.toggle("hidden", isForgot);

  $("username").required = isRegister;
  $("username").disabled = !isRegister;

  $("password").classList.toggle("hidden", isForgot);
  $("password").required = !isForgot;
  $("password").disabled = isForgot;

  $("heading").textContent = isLogin
    ? "تسجيل الدخول"
    : isRegister
      ? "إنشاء حساب جديد"
      : "استعادة كلمة المرور";

  $("subtitle").textContent = isLogin
    ? "أهلًا بعودتك. تابع رحلتك بين عوالم القصص."
    : isRegister
      ? "أنشئ حسابك وابدأ رحلتك في عالم NOIR."
      : "أدخل بريدك الإلكتروني لاستعادة حسابك.";

  $("submitText").textContent = isLogin
    ? "تسجيل الدخول"
    : isRegister
      ? "إنشاء حساب"
      : "إرسال رابط الاستعادة";

  $("togglePassword").classList.toggle("hidden", isForgot);

  $("bottomLabel").textContent = isLogin
    ? "ليس لديك حساب؟"
    : isRegister
      ? "لديك حساب بالفعل؟"
      : "تذكرت كلمة المرور؟";

  $("switchLink").textContent = isLogin
    ? "إنشاء حساب جديد"
    : isRegister
      ? "تسجيل الدخول"
      : "العودة لتسجيل الدخول";

  $("switchLink").href = "#";

  $("googleText").textContent = "المتابعة باستخدام Google";
}

$("switchLink").addEventListener("click", event => {
  event.preventDefault();

  if (mode === "login") {
    setMode("register");
  } else {
    setMode("login");
  }
});

$("forgotLink").addEventListener("click", event => {
  event.preventDefault();
  setMode("forgot");
});

$("togglePassword").addEventListener("click", () => {
  const input = $("password");
  const showing = input.type === "text";

  input.type = showing ? "password" : "text";
  $("togglePassword").textContent = showing ? "◉" : "◎";
  $("togglePassword").setAttribute(
    "aria-label",
    showing ? "إظهار كلمة المرور" : "إخفاء كلمة المرور"
  );
});

$("accountForm").addEventListener("submit", event => {
  event.preventDefault();

  if (!$("accountForm").reportValidity()) return;

  if (mode === "forgot") {
    $("notice").textContent =
      "واجهة الاستعادة جاهزة، لكن إرسال رابط الاستعادة يحتاج إلى ربط خدمة الحسابات.";
    return;
  }

  if (mode === "register") {
    $("notice").textContent =
      "تصميم التسجيل جاهز. لحفظ الحساب وإنشائه فعليًا، يجب ربط الموقع بخدمة مصادقة.";
    return;
  }

  $("notice").textContent =
    "واجهة تسجيل الدخول جاهزة. التحقق من الحساب يتطلب ربط خدمة مصادقة.";
});

$("googleBtn").addEventListener("click", () => {
  $("notice").textContent =
    "تسجيل الدخول عبر Google يحتاج إلى إعداد OAuth وربط المشروع بخدمة مصادقة.";
});
</script>

</body>
</html>
